name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: windows-latest
    name: Build, Test & Package

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies
      run: dotnet restore AppTrace.slnx

    - name: Build Solution (Release)
      run: dotnet build AppTrace.slnx -c Release --no-restore

    - name: Execute Automated Test Suite
      run: dotnet test AppTrace.slnx -c Release --no-build --verbosity normal

    - name: Publish Windows x64 Distribution
      run: |
        dotnet publish AppTrace.UI\AppTrace.UI.csproj -c Release -r win-x64 --no-self-contained -o ./artifacts/AppTrace-win-x64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AppTrace-Windows-x64
        path: ./artifacts/AppTrace-win-x64
        retention-days: 14
